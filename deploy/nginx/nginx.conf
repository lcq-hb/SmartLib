# =============================================================================
# SmartLib Nginx 入口配置（蓝图 §6.3 A2 多实例 + A4 入口限流）
#
# 挂载方式：docker-compose 把 ./nginx 整体挂到 /etc/nginx/conf.d，
#          官方镜像的 /etc/nginx/nginx.conf 在 http 块内 include conf.d/*.conf，
#          因此本文件是 "http 上下文片段"，不写 events/http 外壳。
#
# 关键设计：
#   1) upstream 双实例 + keepalive 长连接 + max_fails/fail_timeout 被动健康检查
#      —— 一个实例挂掉后 Nginx 在 10s 内摘除该节点，故障恢复 <30s（A2 验收线）
#   2) /internal/ 只允许内网网段访问（容器网段 172.16.0.0/12），公网一律 403
#   3) /agent/ 反代 Agent 服务：必须关掉 buffering/cache，read_timeout 放到 600s，
#      否则 SSE 流式回答会被 Nginx 缓冲，读者端表现为"卡住半天一次性刷出"
#   4) 双层限流：网关令牌桶（此文件）+ 应用层 TokenBucketRateLimiter（A4）
#   5) proxy_set_header 统一声明在 server 上下文本文件内（http 上下文不允许该指令，
#      写在 http 块会让 nginx -t 报 "directive is not allowed here"）
#
# 校验：docker run --rm -v "$PWD/nginx:/etc/nginx/conf.d:ro" nginx:1.27-alpine nginx -t
# =============================================================================

# ---------------------------- 日志 -------------------------------------------
# 在 combined 基础上补上游耗时与上游地址：
# 压测时用 $upstream_response_time 区分"Nginx 慢"还是"后端慢"
log_format smartlib_main '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time '
                         'urt=$upstream_response_time uaddr=$upstream_addr '
                         'trace=$http_x_trace_id';

# ---------------------------- 基础性能 ---------------------------------------
sendfile        on;
tcp_nopush      on;
tcp_nodelay     on;
keepalive_timeout 65s;
keepalive_requests 1000;
client_max_body_size 4m;
client_body_timeout 30s;
client_header_timeout 15s;
reset_timedout_connection on;
server_tokens off;

# ---------------------------- gzip ------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
# 刻意不包含 text/event-stream：SSE 压缩会让首 Token 延迟变差
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/x-font-ttf
    image/svg+xml;

# ---------------------------- 限流 ------------------------------------------
# 读接口宽、写接口窄：借书涉及库存行锁，入口就该先削一刀
limit_req_zone $binary_remote_addr zone=smartlib_api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=smartlib_write:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=smartlib_agent:10m rate=20r/s;
# 并发连接数限制：防止单个客户端把连接池打满（A4 入口保护）
limit_conn_zone $binary_remote_addr zone=smartlib_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# ---------------------------- 上游 ------------------------------------------
# 双后端实例：max_fails=2 / fail_timeout=10s，连续 2 次失败即摘除 10 秒，
# 期间流量全给另一台；10 秒后自动重新纳入（被动健康检查，无需额外模块）。
upstream smartlib_backend {
    server backend-1:8080 max_fails=2 fail_timeout=10s;
    server backend-2:8080 max_fails=2 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream smartlib_agent {
    server agent-1:8000 max_fails=2 fail_timeout=10s;
    server agent-2:8000 max_fails=2 fail_timeout=10s;
    keepalive 16;
    keepalive_timeout 600s;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log smartlib_main;

    # ---------------------------- 公共代理头 ------------------------------
    # 放在 server 上下文：以下 location 全部继承，避免逐段重复。
    # trace 透传是 Java/Python 跨服务排查的前提（蓝图 §11 trace_id）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Trace-Id        $http_x_trace_id;
    # keepalive 到 upstream 的前提：不能把客户端的 Connection 头透传上去
    proxy_set_header Connection        "";

    # ---------------------------- 安全头 ---------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS 只在真正上了 TLS 的入口开启，本地 80 端口开了会把浏览器锁死
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn smartlib_conn 200;

    # ---------------------------- Nginx 自身探针 --------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------- 后端健康探针 ----------------------------
    # Compose/K8s 探针直接打这里，绕过限流，避免探针把限流额度吃掉
    location = /actuator/health {
        limit_req off;
        limit_conn off;
        proxy_pass http://smartlib_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location /actuator/ {
        # 监控端点不对外开放：只允许内网网段抓 /actuator/prometheus
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://smartlib_backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    # ---------------------------- 写接口（借还/预约） ---------------------
    # 正则 location 优先于前缀 location：即使 /api/borrows 也匹配 /api/，仍走这条
    location ~ ^/api/(borrows|reservations) {
        limit_req zone=smartlib_write burst=100 nodelay;
        limit_conn smartlib_conn 50;
        proxy_pass http://smartlib_backend;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # 幂等：同一 Idempotency-Key 的重试允许打到不同实例，后端用幂等表兜底
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ---------------------------- 业务读接口 -----------------------------
    location /api/ {
        limit_req zone=smartlib_api burst=400 nodelay;
        limit_conn smartlib_conn 100;
        proxy_pass http://smartlib_backend;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ---------------------------- 内部工具接口 ---------------------------
    # 仅容器网段放行：Agent 服务调后端工具走这条路径。
    # 公网访问直接 403，保证 /internal/agent/** 不被外部探测。
    location /internal/ {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://smartlib_backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # ---------------------------- Agent 服务（含 SSE） -------------------
    # 必须：proxy_buffering off / proxy_cache off / proxy_read_timeout 600s
    # 否则流式回答被缓冲，首 Token 延迟直接崩掉（蓝图 §7 目标 <1.5s）。
    # 路径不做重写：/agent/xxx 原样转给 Agent 服务（proxy_pass 不带 URI 部分）。
    # 若 Agent 侧路由不带 /agent 前缀，改为 location /chat/ 之类的前缀即可。
    location /agent/ {
        limit_req zone=smartlib_agent burst=40 nodelay;
        limit_conn smartlib_conn 40;
        proxy_pass http://smartlib_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        # 关掉 Nginx 对 SSE 的 gzip，避免事件被攒成块
        gzip off;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    # Agent 健康探针（供 Compose/K8s 使用；Agent 自身路由是 /health）
    location = /agent-health {
        limit_req off;
        limit_conn off;
        proxy_pass http://smartlib_agent/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # ---------------------------- 网关首页 -------------------------------
    location = / {
        add_header Content-Type text/plain;
        return 200 "SmartLib gateway is up. Try /api/books?query=Java or /agent-health\n";
    }

    # ---------------------------- 错误页（统一响应体） -------------------
    error_page 403 /403.json;
    location = /403.json {
        internal;
        add_header Content-Type application/json;
        return 403 '{"code":40301,"msg":"forbidden","data":null,"traceId":""}';
    }

    error_page 429 /429.json;
    location = /429.json {
        internal;
        add_header Content-Type application/json;
        return 429 '{"code":42901,"msg":"too many requests","data":null,"traceId":""}';
    }

    # ---------------------------- 默认拒绝 -------------------------------
    location / {
        return 404;
    }
}
