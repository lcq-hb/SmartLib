[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# 每个测试都必须能离线跑：不连 Java 后端、不连真实 LLM
#
# -p no:cacheprovider：关掉 .pytest_cache 写入。
#   Windows 受限环境下该目录可能不可写，会刷一堆 PytestCacheWarning 掩盖真实失败，
#   而缓存对我们没有价值（不需要 --lf 这类增量重跑）。
# 另外测试刻意不使用 pytest 的 tmp_path 夹具：它依赖系统临时目录，
# 在本机沙箱下不可写；本服务的测试全部在内存里完成，不需要落盘。
addopts = -q --strict-markers -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
